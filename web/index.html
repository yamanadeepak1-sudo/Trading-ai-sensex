<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading AI — SENSEX</title><style>body{font-family:system-ui;margin:0;background:#0d1117;color:#eee}main{max-width:700px;margin:auto;padding:16px}.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:22px}.signal{font-size:38px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#0d1117;padding:12px;border-radius:12px}.muted{color:#9da7b3;font-size:13px}button,select{width:100%;padding:13px;border:0;border-radius:12px;font-weight:700}select{background:#0d1117;color:#eee;border:1px solid #30363d;margin-top:8px}</style></head><body><main><h1>Trading AI Tool</h1><div class="card"><div class="muted">BSE SENSEX · PAPER MODE</div><label class="muted">Timeframe</label><select id="tf" onchange="loadSignal()"><option value="1minute">1 minute</option><option value="2minute">2 minutes</option><option value="3minute">3 minutes</option><option value="5minute" selected>5 minutes</option><option value="10minute">10 minutes</option><option value="15minute">15 minutes</option><option value="30minute">30 minutes</option><option value="1hour">1 hour</option><option value="4hour">4 hours</option><option value="1day">1 day</option><option value="1week">1 week</option><option value="1month">1 month</option></select><div id="signal" class="signal">Loading…</div><div id="time" class="muted"></div></div><div class="card grid"><div class="item"><div class="muted">Price</div><b id="price">—</b></div><div class="item"><div class="muted">Score</div><b id="score">—</b></div><div class="item"><div class="muted">Stop Loss</div><b id="sl">—</b></div><div class="item"><div class="muted">Target 1</div><b id="t1">—</b></div><div class="item"><div class="muted">Target 2</div><b id="t2">—</b></div><div class="item"><div class="muted">Target 3</div><b id="t3">—</b></div><div class="item"><div class="muted">RSI</div><b id="rsi">—</b></div><div class="item"><div class="muted">ATR</div><b id="atr">—</b></div></div><div class="card"><button onclick="loadSignal()">Refresh signal</button><p class="muted">Research/paper-trading prototype. Signals cannot guarantee exact entries, exits, or profits.</p></div><script>async function loadSignal(){const tf=document.querySelector('#tf').value;try{const r=await fetch('/api/signal?interval='+encodeURIComponent(tf));const s=await r.json();if(!r.ok)throw new Error(s.detail||'Server error');document.querySelector('#signal').textContent=s.signal;document.querySelector('#time').textContent=s.candle_time;for(const [id,key] of [['price','price'],['score','score'],['sl','stop_loss'],['t1','target1'],['t2','target2'],['t3','target3'],['rsi','rsi'],['atr','atr']])document.querySelector('#'+id).textContent=s[key]??'—'}catch(e){document.querySelector('#signal').textContent='ERROR';document.querySelector('#time').textContent=e.message}}loadSignal();setInterval(loadSignal,60000);</script></main></body></html>
